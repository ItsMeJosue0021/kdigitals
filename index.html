<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>KDigitals</title>
    <script>
      /*
        Applies the saved theme before the first paint, so a dark-mode
        visitor never gets a flash of the light page. Mirrors the storage
        key, class name, and system fallback in src/lib/theme.ts — update
        both together.
      */
      ;(function () {
        try {
          var stored = localStorage.getItem('kstore-theme')
          var isDark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)

          document.documentElement.classList.toggle('dark', isDark)
        } catch (error) {
          // Storage or matchMedia unavailable: stay on the light default.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
